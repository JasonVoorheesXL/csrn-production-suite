name: Phase 5.6 Compact Diagnostic

on:
  push:
    branches:
      - phase/5.6-broadcast-package-lifecycle-routes
  pull_request:
    branches:
      - develop-1.13

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python tools/ci_prepare.py
      - name: Apply integration and run focused tests
        id: focused
        continue-on-error: true
        run: |
          python tools/ci_apply.py > phase5.log 2>&1
          python -m pytest -q tests/test_broadcast_package_routes_blueprint.py tests/test_broadcast_routes_blueprint.py tests/test_broadcast_lifecycle_routes_blueprint.py tests/test_broadcast_route_architecture.py tests/test_phase_5_6_migration.py --tb=short >> phase5.log 2>&1
      - name: Run full validation
        id: full
        continue-on-error: true
        run: python tools/dev_workflow.py validate > full.log 2>&1
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-6-logs
          path: |
            phase5.log
            full.log
      - name: Report results
        if: always()
        run: |
          cat phase5.log
          tail -n 180 full.log
          test "${{ steps.focused.outcome }}" = "success"
          test "${{ steps.full.outcome }}" = "success"
