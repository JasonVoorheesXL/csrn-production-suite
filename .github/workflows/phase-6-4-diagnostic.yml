name: Phase 6.4 Diagnostic

on:
  push:
    branches:
      - phase/6.4-channel-captioning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run focused diagnostic
        shell: bash
        run: |
          python tools/ci_prepare.py
          python -m pytest -q tests/test_caption_service.py tests/test_caption_routes.py tests/test_caption_worker.py tests/test_caption_architecture.py tests/test_phase_6_4_migration.py > phase64.log 2>&1 || true
          cat phase64.log
      - uses: actions/upload-artifact@v4
        with:
          name: phase-6-4-log
          path: phase64.log
