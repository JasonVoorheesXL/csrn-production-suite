name: Phase 4.24 Compact Diagnostic

on:
  push:
    branches:
      - phase/4.24-phase-4-consolidation
  pull_request:
    branches:
      - develop-1.13

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python tools/ci_prepare.py
      - run: python tools/ci_apply.py
      - name: Run architecture audit and focused tests
        id: focused
        continue-on-error: true
        run: |
          python phase4_architecture.py > phase4.log 2>&1
          python -m pytest -q tests/test_phase_4_architecture.py tests/test_phase_4_24_migration.py --tb=short >> phase4.log 2>&1
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-24-log
          path: phase4.log
      - name: Report focused result
        if: always()
        run: |
          cat phase4.log
          test "${{ steps.focused.outcome }}" = "success"
