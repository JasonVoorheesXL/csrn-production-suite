name: Phase 4.16 Compact Diagnostic

on:
  push:
    branches:
      - phase/4.16-diagnostics-service
  pull_request:
    branches:
      - develop-1.13

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run focused diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o repo.zip "https://api.github.com/repos/${{ github.repository }}/zipball/${{ github.sha }}"
          unzip -q repo.zip -d source
          cd source/*
          python3 -m pip install -q -r requirements.txt pytest
          python3 tools/ci_prepare.py
          python3 -m pytest -q tests/test_diagnostics_service.py tests/test_diagnostics_routes.py tests/test_phase_4_16_migration.py --tb=short > pytest.log 2>&1 || { tail -n 80 pytest.log; exit 1; }
          cat pytest.log
