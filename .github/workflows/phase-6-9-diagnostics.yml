name: Phase 6.9 Focused Diagnostics

on:
  push:
    branches:
      - phase/6.9-social-publishing-engine
  pull_request:
    branches:
      - develop-1.13

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply Phase 6.9 integration
        run: python tools/ci_apply.py
      - name: Run focused and full diagnostics
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_social_platforms.py \
            tests/test_social_assets_and_cards.py \
            tests/test_social_service.py \
            tests/test_social_routes.py \
            tests/test_social_architecture.py \
            tests/test_phase_6_9_migration.py > phase69-focused.txt 2>&1
          focused_code=$?
          python tools/dev_workflow.py validate > phase69-full.txt 2>&1
          full_code=$?
          echo "$focused_code" > phase69-focused-exit-code.txt
          echo "$full_code" > phase69-full-exit-code.txt
          echo "--- focused ---"
          tail -n 120 phase69-focused.txt
          echo "--- full ---"
          tail -n 260 phase69-full.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase69-diagnostics
          path: |
            phase69-focused.txt
            phase69-full.txt
            phase69-focused-exit-code.txt
            phase69-full-exit-code.txt
          retention-days: 1
