name: Phase 4.18 Compact Diagnostic

on:
  push:
    branches:
      - phase/4.18-event-service

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python tools/ci_prepare.py
      - name: Run focused Event Service tests
        run: |
          python -m pytest -q tests/test_event_service.py tests/test_event_routes.py tests/test_phase_4_18_migration.py --tb=short > pytest.log 2>&1 || { tail -n 120 pytest.log; exit 1; }
          cat pytest.log
