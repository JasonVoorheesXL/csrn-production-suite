name: Phase 6.2 Diagnostic

on:
  pull_request:
    branches:
      - develop-1.13

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Apply phase integration
        run: python tools/ci_apply.py

      - name: Run focused diagnostics
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_social_publishers.py \
            tests/test_social_post_repository.py \
            tests/test_social_card_renderer.py \
            tests/test_social_publishing_service.py \
            tests/test_social_routes.py \
            tests/test_social_publishing_architecture.py \
            tests/test_phase_6_2_migration.py > focused.txt 2>&1
          code=$?
          echo "exit_code=$code" >> focused.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run full diagnostics
        id: full
        shell: bash
        run: |
          set +e
          python tools/dev_workflow.py validate > full.txt 2>&1
          code=$?
          echo "exit_code=$code" >> full.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-2-diagnostic
          path: |
            focused.txt
            full.txt
          if-no-files-found: error

      - name: Fail when validation failed
        if: steps.focused.outputs.code != '0' || steps.full.outputs.code != '0'
        run: exit 1
