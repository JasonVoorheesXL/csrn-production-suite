name: Validate CSRN Suite

on:
  push:
    branches:
      - develop-1.13
      - release/1.13-foundation
      - "phase/**"
  pull_request:
    branches:
      - develop-1.13
      - release/1.13-foundation
      - "phase/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply optional phase integration
        run: python tools/ci_prepare.py

      - name: Capture Phase 6.5 focused validation
        shell: bash
        run: |
          python -m pytest -q tests/test_weather_service.py tests/test_weather_routes.py tests/test_weather_worker.py tests/test_weather_architecture.py tests/test_phase_6_5_migration.py > phase65-${{ runner.os }}.log 2>&1 || true
          cat phase65-${{ runner.os }}.log

      - name: Upload Phase 6.5 focused validation
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-5-${{ runner.os }}
          path: phase65-${{ runner.os }}.log

      - name: Validate repository
        run: python tools/dev_workflow.py validate
