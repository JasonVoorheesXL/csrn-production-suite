name: Validate CSRN Suite

on:
  push:
    branches:
      - develop-1.13
      - release/1.13-foundation
      - "phase/**"
  pull_request:
    branches:
      - develop-1.13
      - release/1.13-foundation
      - "phase/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify locked development environment
        run: python tools/environment_check.py --profile development

      - name: Apply optional phase integration
        run: python tools/ci_prepare.py

      - name: Validate repository
        run: python tools/dev_workflow.py validate
