name: Phase 4.15 Focused Diagnostic

on:
  push:
    branches:
      - phase/4.15-state-service
  pull_request:
    branches:
      - develop-1.13

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python tools/ci_prepare.py
      - run: python -m pytest -q tests/test_state_service.py tests/test_state_routes.py tests/test_phase_4_15_migration.py --tb=short
