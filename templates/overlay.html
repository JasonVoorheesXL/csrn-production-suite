<script>
function escapeTicker(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sportBall(sport){const value=String(sport||'football').toLowerCase();if(value.includes('basket'))return '🏀';if(value.includes('baseball'))return '⚾';if(value.includes('softball'))return '🥎';if(value.includes('soccer'))return '⚽';if(value.includes('volley'))return '🏐';return '🏈'}
function glowColor(hex){const m=String(hex||'').match(/^#?([0-9a-f]{6})$/i);if(!m)return {solid:'#ffffff',glow:'rgba(255,255,255,.72)'};let n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;const lum=.2126*r+.7152*g+.0722*b;const factor=lum<90?1.8:lum>210?.62:1.18;r=Math.max(0,Math.min(255,Math.round(r*factor)));g=Math.max(0,Math.min(255,Math.round(g*factor)));b=Math.max(0,Math.min(255,Math.round(b*factor)));return {solid:`rgb(${r},${g},${b})`,glow:`rgba(${r},${g},${b},.78)`}}
function fitName(el,text,large){
  el.textContent=text||'';
  const wrap=el.parentElement;
  const baseSize=large?50:31;
  const minSize=large?35:22;
  const maxHeight=large?92:48;
  el.style.transform='none';
  el.style.width='auto';
  el.style.whiteSpace='normal';
  el.style.fontSize=`${baseSize}px`;
  requestAnimationFrame(()=>{
    let size=baseSize;
    while(size>minSize && (el.scrollHeight>maxHeight || el.scrollWidth>wrap.clientWidth+1)){
      size-=1;
      el.style.fontSize=`${size}px`;
    }
  });
}
