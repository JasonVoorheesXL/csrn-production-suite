<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSRN Broadcast State Overlay</title>
<style>
:root{--bg:#0d1015;--panel:#171c24;--line:rgba(255,255,255,.14);--muted:#aeb7c4;--brand-primary:#c9203b;--brand-secondary:#000000;--brand-accent:#ffffff;--white:#f5f7fa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif}
#root{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease}
#root.visible{opacity:1}
.stage{position:absolute;inset:0;border:2px solid color-mix(in srgb,var(--brand-primary) 90%,#ff243d);background:radial-gradient(circle at 14% 22%,rgba(160,8,27,.18),transparent 30%),radial-gradient(circle at 96% 86%,rgba(150,6,24,.16),transparent 22%),linear-gradient(135deg,#06080b,#0f141b 60%,#07090d);display:grid;grid-template-rows:auto 1fr auto auto}
.topbar{height:220px;display:flex;align-items:center;justify-content:space-between;padding:0 58px;border-bottom:3px solid var(--brand-primary);background:linear-gradient(90deg,color-mix(in srgb,var(--brand-secondary) 92%,#10141b),#090c11 70%);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.brand{display:flex;align-items:center;gap:24px;min-width:0}.brand img{width:132px;height:132px;object-fit:cover;border-radius:50%;clip-path:circle(50% at 50% 50%);background:transparent;filter:drop-shadow(0 4px 9px rgba(0,0,0,.45))}.brand-copy{min-width:0}.brand-line{display:flex;align-items:flex-end;gap:30px;white-space:nowrap;min-height:112px}.brand-short{position:relative;display:inline-block;font-family:"CSRN Karantina","Arial Black",sans-serif;font-size:144px;font-weight:700;letter-spacing:.005em;line-height:.69;text-transform:uppercase;color:var(--brand-primary);-webkit-text-stroke:1.8px #f7f7f7;paint-order:stroke fill;text-shadow:none;transform:skewX(-6deg);transform-origin:left center}.brand-short::after{content:attr(data-text);position:absolute;inset:0;color:transparent;-webkit-text-stroke:.45px rgba(255,255,255,.28);transform:translate(-1px,-1px);pointer-events:none}.brand-pregame{font-family:"CSRN Michroma","Arial Black",sans-serif;font-size:50px;font-weight:400;letter-spacing:.025em;line-height:.92;background:linear-gradient(180deg,#ffffff 0%,#d4d7dc 55%,#90959e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;text-shadow:3px 4px 0 rgba(0,0,0,.82);transform:skewX(-5deg);transform-origin:left center}.brand-long{display:block;color:var(--brand-primary);font-family:"CSRN Michroma","Arial",sans-serif;font-weight:400;letter-spacing:.09em;font-size:15px;margin-top:10px;text-transform:uppercase;font-style:italic}
.statebadge{font-family:"CSRN Michroma","Arial",sans-serif;font-weight:400;letter-spacing:.12em;border:1px solid color-mix(in srgb,var(--brand-primary) 60%,#ffffff);border-radius:999px;padding:13px 22px;background:color-mix(in srgb,var(--brand-primary) 25%,transparent)}
.statebadge.delay{background:#7b240e;border-color:#e98a59}
.statebadge.halftime{background:#7a5c0e;border-color:#e0b84a}
.main{display:grid;grid-template-columns:36% 64%;min-height:0}
.hero{padding:34px 46px 24px 64px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:"CSRN Michroma","Arial",sans-serif;font-size:26px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-primary);font-weight:400;margin-bottom:26px}
.matchup{display:grid;gap:18px}.team{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:18px}.team img{width:84px;height:84px;object-fit:contain}.teamname{font-size:40px;font-weight:900;line-height:1.02}.teammeta{color:var(--muted);font-size:17px;margin-top:6px}
.team-social{display:flex;align-items:center;gap:10px;margin-top:9px;min-height:24px}
.team-social:empty{display:none}
.team-social-item{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid rgba(255,255,255,.20);border-radius:999px;background:rgba(255,255,255,.055);color:#f5f7fa;font-family:"CSRN Michroma","Arial",sans-serif;font-size:10px;letter-spacing:.045em;white-space:nowrap}
.team-social-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--brand-primary);color:#fff;font-family:Arial Black,Arial,sans-serif;font-size:12px;line-height:1}
.at{font-size:20px;color:var(--muted);font-weight:800;padding-left:102px}
.countdown-wrap{margin-top:26px;padding-top:26px;border-top:1px solid rgba(255,255,255,.18)}.count-label{font-family:"CSRN Michroma","Arial",sans-serif;font-size:26px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:400}.countdown{font-family:"Arial Black",Arial,sans-serif;font-size:68px;font-weight:900;letter-spacing:.055em;margin-top:9px;text-shadow:3px 4px 0 #050609}.delay-note{font-size:20px;line-height:1.35;margin-top:10px;color:#ffd6c5}
.content{padding:36px 64px 28px 52px;min-width:0;display:flex;align-items:center}.card{width:100%;display:none;animation:fade .4s ease}.card.active{display:block}@keyframes fade{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-kicker{font-family:"CSRN Michroma","Arial",sans-serif;font-size:12px;color:var(--brand-primary);text-transform:uppercase;letter-spacing:.11em;font-weight:400}.card h1{font-size:44px;margin:9px 0 24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.info{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:14px;padding:22px}.info span{display:block;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.09em}.info strong{display:block;font-size:25px;margin-top:8px;overflow-wrap:anywhere}
.spotlight-row{display:flex;gap:28px;align-items:center}
.spotlight-portrait{flex:0 0 auto;width:132px;height:132px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:rgba(255,255,255,.055)}
.spotlight-meta{min-width:0}
.spotlight-meta .teammeta{font-size:20px;margin-top:10px}
.spotlight-credit{font-size:18px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.profile-team{min-height:220px}
.profile-team>span{font-size:18px}
.profile-team>strong{font-size:34px;margin-top:10px}
.profile-socials{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.profile-social{display:flex;align-items:center;gap:13px;min-height:46px;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.035)}
.profile-social-icon{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Arial Black,Arial,sans-serif;font-size:23px;font-weight:900;color:#fff}
.profile-social-icon.facebook{background:#0866FF;box-shadow:0 0 10px rgba(8,102,255,.30)}
.profile-social-icon.x{background:#050505;border:1px solid rgba(255,255,255,.55);box-shadow:0 0 8px rgba(255,255,255,.10)}
.profile-social-handle{font-size:22px;font-weight:800;color:#fff;letter-spacing:.015em;overflow-wrap:anywhere}
.story{font-size:27px;line-height:1.35;padding:18px 0;border-bottom:1px solid var(--line)}.story:last-child{border-bottom:0}
.weather-main{display:flex;gap:28px;align-items:end}.temp{font-size:76px;font-weight:900}.weather-text{font-size:28px;padding-bottom:11px;line-height:1.25}.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.weather-cell{background:rgba(255,255,255,.055);border:1px solid var(--line);padding:18px;border-radius:12px}.weather-cell span{display:block;color:var(--muted);font-size:18px}.weather-cell strong{display:block;margin-top:7px;font-size:25px}.forecast-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}.forecast-hour{padding:18px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045);text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center}.forecast-hour span,.forecast-hour small{display:block;color:var(--muted);font-size:20px;line-height:1.2}.forecast-hour strong{display:block;font-size:38px;margin:8px 0}.forecast-hour em{display:block;font-style:normal;font-size:20px;line-height:1.2;min-height:48px}
.scoreline{display:flex;justify-content:space-between;align-items:center;gap:20px}.scoreteam{font-size:28px;font-weight:800}.score{font-size:70px;font-weight:900}.situation{font-size:25px;margin-top:30px;color:var(--muted)}
.brand-ribbon{height:126px;display:grid;grid-template-columns:1.6fr .85fr .85fr .72fr;align-items:center;gap:0;padding:0 42px;border-top:3px solid var(--brand-primary);border-bottom:1px solid rgba(255,255,255,.12);background:linear-gradient(90deg,#050609,color-mix(in srgb,var(--brand-primary) 12%,#050609) 44%,#050609);box-shadow:inset 0 12px 34px rgba(0,0,0,.42)}
.brand-ribbon-network{display:grid;grid-template-columns:205px minmax(0,1fr);align-items:center;gap:18px;padding-right:26px;border-right:2px solid color-mix(in srgb,var(--brand-primary) 65%,transparent);min-width:0}

.broadcast-headset{width:92px;height:88px;position:relative;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--brand-primary) 28%,transparent))}.headset-band{position:absolute;left:15px;top:4px;width:62px;height:54px;border:7px solid #f5f5f5;border-bottom:0;border-radius:36px 36px 0 0}.headset-ear{position:absolute;top:40px;width:20px;height:34px;border:4px solid var(--brand-primary);background:#0a0c10;border-radius:8px}.headset-ear.left{left:8px}.headset-ear.right{right:8px}.headset-boom{position:absolute;right:-2px;top:56px;width:42px;height:4px;background:#f5f5f5;transform:rotate(15deg);transform-origin:left center;border-radius:4px}.headset-mic{position:absolute;right:-8px;top:66px;width:10px;height:10px;background:var(--brand-primary);border:2px solid #fff;border-radius:50%}.broadcast-headset-image{width:190px;height:126px;display:block;object-fit:contain;opacity:1;visibility:visible;position:relative;z-index:5;padding:0;background:none!important;box-shadow:none!important;border-radius:12px;filter:drop-shadow(0 0 5px rgba(255,255,255,.15)) drop-shadow(0 0 10px rgba(201,32,59,.34))}.brand-ribbon-copy{min-width:0}.brand-ribbon-copy strong{font-family:"CSRN Michroma","Arial",sans-serif;font-size:25px;letter-spacing:.035em;text-transform:uppercase;font-weight:400;font-style:italic;white-space:nowrap;color:#fff}.brand-ribbon-copy strong #orgRibbonShort{display:inline-block;font-family:"CSRN Karantina","Arial Black",sans-serif;font-style:normal;color:var(--brand-primary);font-size:105px;font-weight:700;line-height:.60;margin-left:12px;letter-spacing:.005em;-webkit-text-stroke:1.5px #f6f6f6;paint-order:stroke fill;text-shadow:none;transform:skewX(-6deg);transform-origin:left center}.brand-ribbon-copy>span{display:block;margin-top:8px;color:#f3f4f6;font-family:"CSRN Michroma","Arial",sans-serif;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-style:italic;white-space:nowrap}
.social-card{height:82px;display:grid;grid-template-columns:58px 1fr;align-items:center;gap:13px;padding:0 24px;border-right:1px solid rgba(255,255,255,.30)}.social-icon{width:52px;height:52px;border:2px solid var(--brand-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Arial Black,Arial,sans-serif;font-size:34px;color:#fff;background:#090b0f;box-shadow:0 0 12px color-mix(in srgb,var(--brand-primary) 24%,transparent)}.play-icon{font-size:21px;padding-left:3px}.social-card small{display:block;font-family:"CSRN Michroma","Arial",sans-serif;font-size:9px;color:#fff;letter-spacing:.08em}.social-card strong{display:block;font-family:"CSRN Michroma","Arial",sans-serif;font-size:14px;color:#fff;letter-spacing:.04em;margin:4px 0}.social-card span{display:block;color:#f0f1f4;font-size:13px;white-space:nowrap}
.brand-ribbon-tag{font-family:"CSRN Michroma","Arial",sans-serif;font-size:13px;font-weight:400;letter-spacing:.035em;text-transform:uppercase;color:#fff;text-align:right;line-height:1.6;font-style:italic;padding-left:22px}.brand-ribbon-tag b{color:var(--brand-primary);font-weight:400}
.hidden-brand-logo{display:none!important}
.social-strip{display:none!important}.footer{height:54px;border-top:1px solid rgba(255,255,255,.12);background:#080b10;display:flex;align-items:center;justify-content:space-between;padding:0 36px;font-size:16px}.footer strong{letter-spacing:.03em}.footer .dots{display:flex;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#4c5563}.dot.active{background:var(--brand-primary)}
.empty{font-size:28px;color:var(--muted)}

@font-face{font-family:"CSRN Bangers";src:url("/static/fonts/bangers-regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"CSRN Michroma";src:url("/static/fonts/michroma-regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"CSRN Karantina";src:url("/static/fonts/karantina-700.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}

/* Larger CSRN destination handles for broadcast readability */
#facebookHandle,
#youtubeHandle{
  display:block;
  font-size:20px !important;
  line-height:1.12 !important;
  font-weight:700 !important;
  letter-spacing:.01em !important;
  margin-top:2px;
}

</style>
</head>
<body>
<div id="root">
  <div class="stage">
    <div class="topbar">
      <div class="brand"><img id="orgLogo" src="/static/csrn-logo.png"><div class="brand-copy"><div class="brand-line"><strong id="orgShortName" class="brand-short">CSRN</strong><strong id="brandStateLabel" class="brand-pregame">PREGAME</strong></div><span id="orgLongName" class="brand-long">CALEDONIA SPORTS RADIO NETWORK</span></div></div>

          <div class="team"><img id="homeLogo" src="/static/csrn-logo.png"><div><div id="homeName" class="teamname">Home</div><div id="homeMeta" class="teammeta"></div></div></div>

        <div class="social-icon">f</div>
        <div><small>WATCH LIVE</small><strong>FACEBOOK</strong><span id="facebookHandle">/CaledoniaSRN</span></div>
      </div>
      <div class="social-card youtube-card">
        <div class="social-icon play-icon">▶</div>
        <div><small>WATCH LIVE</small><strong>YOUTUBE</strong><span id="youtubeHandle">/CaledoniaSRN</span></div>
      </div>
      <div class="brand-ribbon-tag">YOUR HOME.<br><b>YOUR TEAM.</b><br>YOUR NETWORK.</div>
      <img id="orgRibbonLogo" class="brand-ribbon-logo hidden-brand-logo" src="/static/csrn-logo.png" aria-hidden="true">
      <div id="orgSocialStrip" class="social-strip hidden-brand-logo"></div>
    </div>
    <div class="footer"><strong id="footerText">Game information loading…</strong><div id="dots" class="dots"></div></div>
  </div>
</div>
<script>
let data=null,cards=[],cardIndex=0,lastCardSwitch=0,weatherCache=null,weatherFetchedAt=0;

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logo(identity){return identity?.logo||identity?.primary_logo||identity?.logo_url||'/static/csrn-logo.png'}
function teamLabel(identity,fallback){return identity?.broadcast_name||identity?.team_name||identity?.name||fallback}
function recordText(r){if(!r)return'';return `${Number(r.wins||0)}-${Number(r.losses||0)}${Number(r.ties||0)?'-'+Number(r.ties||0):''}`}
function clockText(sec){sec=Math.max(0,Number(sec||0));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function parseScheduled(game,estimated){
  const date=game?.date||'';
  const raw=estimated||game?.scheduled_start||'';
  if(!date||!raw)return null;
  let t=raw.trim(),m=t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  if(!m)return null;
  let h=Number(m[1]),min=Number(m[2]),ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;
  const d=new Date(`${date}T${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}:00`);
  return Number.isNaN(d.getTime())?null:d;
}
function countdownText(target){
  if(!target)return'--:--:--';
  let ms=Math.max(0,target.getTime()-Date.now()),s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);const x=s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
}
function shouldShow(){
  if(!data?.game?.broadcast_id)return false;
  const cfg=data.settings||{},game=data.game||{};
  if(cfg.mode==='delayed')return true;
  if(cfg.mode==='pregame')return true;
  const phase=String(game.broadcast_phase||game.status||'').toLowerCase();
  // 'halftime' is deliberately NOT excluded -- this overlay is the actual
  // intended halftime view (banner/weather/spotlight rotation), not just a
  // pregame screen. Previously only 'live' was excluded, so 'postgame' and
  // 'final' fell through to showing stale pregame content too.
  if(['live','completed','postgame','final'].includes(phase))return false;
  if(['scheduled','fallback'].includes(cfg.transition_mode)){
    const target=parseScheduled(game,'');
    if(target&&Date.now()>=target.getTime())return false;
  }
  return true;
}
function weatherObject(){
  const w=data?.weather||{};
  return w.current||w.conditions||w.observation||w;
}
function pick(obj,keys){
  for(const k of keys){if(obj&&obj[k]!==undefined&&obj[k]!==null&&obj[k]!=='')return obj[k]}return''
}
function forecastTimeLabel(iso){
 if(!iso)return'';
 const d=new Date(iso);if(Number.isNaN(d.getTime()))return'';
 return d.toLocaleTimeString([], {hour:'numeric'});
}
function weatherCard(){
  const raw=data?.weather||{},periods=Array.isArray(raw.game_forecast)?raw.game_forecast:[];
  const w=weatherObject();
  const kickoff=periods[0]||{};
  const temp=pick(kickoff,['temperature'])||pick(w,['temperature','temperature_f','temp_f','temp','temperatureF']);
  const desc=pick(kickoff,['short_forecast'])||pick(w,['description','conditions','text','short_forecast','summary']);
  const wind=[pick(kickoff,['wind_direction']),pick(kickoff,['wind_speed'])].filter(Boolean).join(' ')||pick(w,['wind','wind_speed','windSpeed','wind_mph']);
  const precip=pick(kickoff,['precipitation_probability'])||pick(w,['precipitation_probability','precip_chance','rain_chance','probability_of_precipitation']);
  const humidity=pick(w,['humidity','relative_humidity']);
  const venue=raw.venue||{};
  if(temp===''&&desc===''&&wind===''&&precip===''&&!periods.length){
  const resolution=raw.location_resolution||{};
  if(resolution.resolved)return `<section class="card"><div class="card-kicker">Weather Through Game</div><h1>Forecast Temporarily Unavailable</h1><div class="info"><span>Resolved Game Area</span><strong>${esc(resolution.label||'Game location')}</strong></div><div class="teammeta" style="margin-top:18px">CSRN resolved the venue area but the hourly forecast service did not return game-window periods yet.</div></section>`;
  return null;
}
  const hourly=periods.length?`<div class="forecast-strip">${periods.slice(0,4).map(p=>`<div class="forecast-hour"><span>${esc(forecastTimeLabel(p.start_time))}</span><strong>${esc(p.temperature??'—')}°</strong><em>${esc(p.short_forecast||'')}</em><small>${p.precipitation_probability!==null&&p.precipitation_probability!==undefined?esc(p.precipitation_probability)+'% rain':''}</small></div>`).join('')}</div>`:'';
  return `<section class="card"><div class="card-kicker">Weather Through Game</div><h1>${data.settings?.mode==='delayed'&&data.settings?.delay_type==='weather'?'Weather Delay Coverage':'Kickoff & Game Forecast'}</h1><div class="weather-main"><div class="temp">${esc(temp)}${temp!==''?'°':''}</div><div class="weather-text">${esc(desc||'Forecast conditions')}<br><span style="color:var(--muted);font-size:17px">${esc(venue.name||data.game.venue||'')}</span></div></div><div class="weather-grid"><div class="weather-cell"><span>Rain Chance</span><strong>${esc(precip||'—')}${precip!==''&&!String(precip).includes('%')?'%':''}</strong></div><div class="weather-cell"><span>Wind</span><strong>${esc(wind||'—')}</strong></div><div class="weather-cell"><span>Humidity</span><strong>${esc(humidity||'—')}${humidity!==''&&!String(humidity).includes('%')?'%':''}</strong></div><div class="weather-cell"><span>Source</span><strong>${esc(raw.source||'CSRN Weather')}</strong></div></div>${hourly}</section>`;
}
function gameDetailsCard(){
 const g=data.game||{};
 return `<section class="card"><div class="card-kicker">Game Information</div><h1>${esc(g.visitor_team)} at ${esc(g.home_team)}</h1><div class="grid2"><div class="info"><span>Kickoff</span><strong>${esc(g.scheduled_start||'TBD')}</strong></div><div class="info"><span>Location</span><strong>${esc(g.venue||'Venue TBD')}</strong></div><div class="info"><span>Week / Contest</span><strong>${esc(g.week!==''?'Week '+g.week:'')} ${g.contest_type?'· '+esc(g.contest_type):''}</strong></div><div class="info"><span>Date</span><strong>${esc(g.date||'TBD')}</strong></div></div></section>`;
}
function footballSocialHandle(value,platform){
 const raw=String(value||'').trim();
 if(!raw)return'';

 let clean=raw
   .replace(/^https?:\/\/(www\.)?/i,'')
   .replace(/[?#].*$/,'')
   .replace(/\/+$/,'');

 const parts=clean.split('/').filter(Boolean);

 let handle=parts.length>1
   ? parts[parts.length-1]
   : clean;

 handle=handle.replace(/^@/,'').trim();

 if(!handle)return'';

 return platform==='x'
   ? '@'+handle
   : '/'+handle;
}

function teamProfileSocial(identity){
 const social=identity?.football_social||{};
 const rows=[];

 const facebook=footballSocialHandle(
   social.facebook,
   'facebook'
 );

 const x=footballSocialHandle(
   social.x,
   'x'
 );

 if(facebook){
   rows.push(
     `<div class="profile-social">`+
       `<div class="profile-social-icon facebook">f</div>`+
       `<div class="profile-social-handle">${esc(facebook)}</div>`+
     `</div>`
   );
 }

 if(x){
   rows.push(
     `<div class="profile-social">`+
       `<div class="profile-social-icon x">X</div>`+
       `<div class="profile-social-handle">${esc(x)}</div>`+
     `</div>`
   );
 }

 return rows.length
   ? `<div class="profile-socials">${rows.join('')}</div>`
   : '';
}

function teamProfilesCard(){
 const g=data.game||{},
       h=data.home_identity||{},
       v=data.visitor_identity||{};

 const visitorClass=[
   g.visitor_classification||v.classification||'',
   g.visitor_region
     ? 'Region '+g.visitor_region
     : ''
 ].filter(Boolean).join(' | ');

 const homeClass=[
   g.home_classification||h.classification||'',
   g.home_region
     ? 'Region '+g.home_region
     : ''
 ].filter(Boolean).join(' | ');

 return `
   <section class="card">
     <div class="card-kicker">Team Profiles</div>
     <h1>Tonight's Teams</h1>

     <div class="grid2">

       <div class="info profile-team">
         <span>${esc(g.visitor_team)}</span>

         <strong>
           ${esc(
             recordText(g.visitor_record) ||
             'Record TBD'
           )}
         </strong>

         <div class="teammeta">
           ${esc(visitorClass)}
         </div>

         ${teamProfileSocial(v)}
       </div>

       <div class="info profile-team">
         <span>${esc(g.home_team)}</span>

         <strong>
           ${esc(
             recordText(g.home_record) ||
             'Record TBD'
           )}
         </strong>

         <div class="teammeta">
           ${esc(homeClass)}
         </div>

         ${teamProfileSocial(h)}
       </div>

     </div>
   </section>`;
}
function nextWeekCard(){
 const n=data.next_matchup||{};if(!n.opponent)return null;
 return `<section class="card"><div class="card-kicker">Next on CSRN</div><h1>Next Matchup</h1><div class="info"><span>Opponent</span><strong>${esc(n.opponent)}</strong></div><div class="grid2" style="margin-top:18px"><div class="info"><span>Date / Time</span><strong>${esc(n.date||'TBD')} ${esc(n.scheduled_start||'')}</strong></div><div class="info"><span>Location</span><strong>${esc(n.location||'')} ${n.venue?'· '+esc(n.venue):''}</strong></div></div></section>`;
}
function storylinesCard(){
 const manual=Array.isArray(data.settings?.storylines)?data.settings.storylines:[];
 const automatic=Array.isArray(data.automatic_storylines)?data.automatic_storylines:[];
 const rows=[...manual,...automatic.filter(x=>!manual.includes(x))].slice(0,6);if(!rows.length)return null;
 return `<section class="card"><div class="card-kicker">What to Watch</div><h1>Pregame Storylines</h1>${rows.map(x=>`<div class="story">${esc(x)}</div>`).join('')}</section>`;
}
function delayGameStateCard(){
 if(data.settings?.mode!=='delayed')return null;
 const g=data.game||{},phase=String(g.broadcast_phase||'').toLowerCase();
 if(phase!=='live'&&Number(g.home_score||0)===0&&Number(g.visitor_score||0)===0)return null;
 return `<section class="card"><div class="card-kicker">Game Status</div><h1>Play Suspended</h1><div class="scoreline"><div><div class="scoreteam">${esc(g.visitor_team)}</div><div class="score">${esc(g.visitor_score)}</div></div><div style="text-align:right"><div class="scoreteam">${esc(g.home_team)}</div><div class="score">${esc(g.home_score)}</div></div></div><div class="situation">${g.quarter?'Q'+esc(g.quarter):''} ${g.clock_visible?'· '+esc(clockText(g.clock_seconds)):''} ${g.down&&g.down!=='Off'?'· '+esc(g.down)+' & '+esc(g.distance):''} ${g.ball_spot?'· '+esc(g.ball_spot):''}</div></section>`;
}
function spotlightCard(entry){
 // Native markup in this page's own card idiom (.card/.card-kicker/.info
 // style) -- the video-board's .bl-college-player rendering lives in a
 // completely separate, unrelated JS/CSS bundle this page never loads, so
 // this reuses the *data* (the graphic snapshot already captured when the
 // spotlight originally fired) rather than that other component.
 if(!entry)return null;
 const name=esc(entry.display_name||entry.full_name||'Player');
 const number=entry.number?`#${esc(entry.number)}`:'';
 const team=esc(entry.team_name||'');
 const detail=esc(entry.play_detail||'');
 const passer=String(entry.passer_name||'').trim();
 const fallback=esc(entry.team_logo||'/static/csrn-logo.png');
 const img=esc(entry.headshot||entry.team_logo||'/static/csrn-logo.png');
 return `
   <section class="card">
     <div class="card-kicker">${esc(entry.eyebrow||'SPOTLIGHT')}${entry.quarter?' · Q'+esc(entry.quarter):''}</div>
     <h1>${name}</h1>
     <div class="spotlight-row">
       <img class="spotlight-portrait" src="${img}" alt="" onerror="this.onerror=null;this.src='${fallback}'">
       <div class="spotlight-meta">
         <div class="teammeta">${[team,number].filter(Boolean).join(' · ')}</div>
         <div class="teammeta">${detail}</div>
         ${passer?`<div class="spotlight-credit">Pass from ${esc(passer)}</div>`:''}
       </div>
     </div>
   </section>`;
}
function sponsorCard(sp){
 // Same sponsor roster the Sponsor Advertisement / Sponsor Spotlight
 // controls use (SponsorService), rendered in this page's own card idiom
 // and dropped into the existing cards[]/tick() rotation -- no separate
 // list, pull, or rotation mechanism.
 if(!sp||!sp.name)return null;
 const logo=esc(sp.logo||'/static/csrn-logo.png');
 return `
   <section class="card">
     <div class="card-kicker">${esc(sp.lead_in||'Proud sponsor of tonight’s broadcast')}</div>
     <h1>${esc(sp.name)}</h1>
     <div class="spotlight-row">
       <img class="spotlight-portrait" src="${logo}" alt="" onerror="this.onerror=null;this.src='/static/csrn-logo.png'">
       ${sp.package?`<div class="spotlight-meta"><div class="teammeta">${esc(sp.package)}</div></div>`:''}
     </div>
   </section>`;
}
function rebuildCards(){
 const weather=weatherCard(),delayState=delayGameStateCard();
 const phase=String(data.game?.broadcast_phase||data.game?.status||'').toLowerCase();
 const halftime=data.settings?.mode!=='delayed'&&phase==='halftime';
 const sponsors=Array.isArray(data.halftime_sponsors)?data.halftime_sponsors.map(sponsorCard):[];
 let list;
 if(data.settings?.mode==='delayed'&&data.settings?.delay_type==='weather'){
   list=[weather,delayState,gameDetailsCard(),teamProfilesCard(),storylinesCard(),nextWeekCard()];
 }else if(data.settings?.mode==='delayed'){
   list=[delayState,gameDetailsCard(),weather,teamProfilesCard(),storylinesCard(),nextWeekCard()];
 }else if(halftime){
   const spotlights=Array.isArray(data.first_half_spotlights)?data.first_half_spotlights:[];
   list=[weather,...spotlights.map(spotlightCard),...sponsors];
 }else{
   list=[gameDetailsCard(),weather,teamProfilesCard(),storylinesCard(),nextWeekCard()];
 }
 cards=list.filter(Boolean);
 document.getElementById('cards').innerHTML=cards.join('')||`<div class="empty">${halftime?'Halftime coverage is loading.':'Pregame information is loading.'}</div>`;
 const dots=document.getElementById('dots');dots.innerHTML=cards.map((_,i)=>`<i class="dot"></i>`).join('');
 cardIndex=Math.min(cardIndex,Math.max(0,cards.length-1));showCard(cardIndex);
}
function showCard(idx){
 const els=[...document.querySelectorAll('.card')];els.forEach((x,i)=>x.classList.toggle('active',i===idx));
 [...document.querySelectorAll('.dot')].forEach((x,i)=>x.classList.toggle('active',i===idx));
}
function applyOrganizationBranding(){
 const org=data?.organization||{};
 const shortName=String(org.short_name||'CSRN').trim()||'CSRN';
 const longName=String(org.name||'Caledonia Sports Radio Network').trim()||'Caledonia Sports Radio Network';
 const logoUrl=String(org.logo||'/static/csrn-logo.png').trim()||'/static/csrn-logo.png';
 const root=document.documentElement;
 root.style.setProperty('--brand-primary',org.primary_color||'#C9203B');
 root.style.setProperty('--brand-secondary',org.secondary_color||'#000000');
 root.style.setProperty('--brand-accent',org.accent_color||'#FFFFFF');
 for(const id of ['orgLogo','orgRibbonLogo']){
   const el=document.getElementById(id);if(el){el.src=logoUrl;el.onerror=()=>{el.onerror=null;el.src='/static/csrn-logo.png'}}
 }
 const shortEl=document.getElementById('orgShortName');shortEl.textContent=shortName;shortEl.dataset.text=shortName;
 document.getElementById('orgLongName').textContent=longName.toUpperCase();
 document.getElementById('orgRibbonShort').textContent=shortName;
 document.getElementById('orgRibbonLong').textContent=longName;
 const social=org.social||{},items=[];
 const cleanSocial=(value)=>String(value||'').replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,'');
 const socialHandle=(value,fallback)=>{const clean=cleanSocial(value);if(!clean)return fallback;const parts=clean.split('/').filter(Boolean);return parts.length>1?'/'+parts.slice(1).join('/'):clean};
 document.getElementById('facebookHandle').textContent=socialHandle(social.facebook,'/CaledoniaSRN');
 document.getElementById('youtubeHandle').textContent=socialHandle(social.youtube,'/CaledoniaSRN');
 if(social.facebook)items.push(`FACEBOOK · ${esc(cleanSocial(social.facebook))}`);
 if(social.youtube)items.push(`YOUTUBE · ${esc(cleanSocial(social.youtube))}`);
 if(social.website)items.push(`WEB · ${esc(cleanSocial(social.website))}`);
 document.getElementById('orgSocialStrip').innerHTML=items.slice(0,3).map(x=>`<span>${x}</span>`).join('');
}

function teamFootballSocial(identity){
 const social=identity?.football_social||{};
 const rows=[];

 if(String(social.facebook||'').trim()){
   rows.push(`<span class="team-social-item"><b class="team-social-icon">f</b><span>FACEBOOK</span></span>`);
 }

 if(String(social.x||'').trim()){
   rows.push(`<span class="team-social-item"><b class="team-social-icon">X</b><span>X</span></span>`);
 }

 return rows.join('');
}

function renderStatic(){
 applyOrganizationBranding();
 const g=data.game||{},cfg=data.settings||{},h=data.home_identity||{},v=data.visitor_identity||{},delayed=cfg.mode==='delayed';
 const phase=String(g.broadcast_phase||g.status||'').toLowerCase();
 const halftime=!delayed&&phase==='halftime';
 const weatherDelay=delayed&&String(cfg.delay_type||'').toLowerCase()==='weather';
 // One state word drives BOTH the pill AND the brand-lockup label. The
 // brand label used to be a hard-coded "PREGAME" that stayed on screen
 // during halftime/delay -- that is the literal "PREGAME" seen live.
 const stateWord=delayed?(weatherDelay?'WEATHER DELAY':'GAME DELAYED'):halftime?'HALFTIME':'PREGAME';
 document.getElementById('stateBadge').textContent=stateWord;
 const brandStateLabel=document.getElementById('brandStateLabel');
 if(brandStateLabel)brandStateLabel.textContent=stateWord;
 document.getElementById('stateBadge').classList.toggle('delay',delayed);
 document.getElementById('stateBadge').classList.toggle('halftime',halftime);
 document.getElementById('heroEyebrow').textContent=delayed?(cfg.delay_type||'Game')+' Delay':halftime?'Halftime':"Tonight's Matchup";
 document.getElementById('visitorName').textContent=teamLabel(v,g.visitor_team||'Visitor');
 document.getElementById('homeName').textContent=teamLabel(h,g.home_team||'Home');
 document.getElementById('visitorLogo').src=logo(v);document.getElementById('homeLogo').src=logo(h);
 document.getElementById('visitorMeta').textContent=[g.visitor_classification,recordText(g.visitor_record)].filter(Boolean).join(' · ');
 document.getElementById('homeMeta').textContent=[g.home_classification,recordText(g.home_record)].filter(Boolean).join(' · ');
document.getElementById('countLabel').textContent=delayed?(cfg.estimated_start?'Estimated Resume In':'Game Delayed'):halftime?'Score at the Half':'Kickoff In';
 document.getElementById('delayNote').textContent=delayed?(cfg.delay_note||'Awaiting an update from game officials.'):'';
 document.getElementById('footerText').textContent=[g.date,g.scheduled_start,g.venue].filter(Boolean).join(' · ')||(halftime?'CSRN Halftime':delayed?'CSRN':'CSRN Pregame');
 document.getElementById('root').classList.toggle('visible',shouldShow());
 rebuildCards();
 if(!lastCardSwitch)lastCardSwitch=Date.now();
}
function tick(){
 if(!data)return;
 const cfg=data.settings||{},g=data.game||{},delayed=cfg.mode==='delayed';
 const phase=String(g.broadcast_phase||g.status||'').toLowerCase();
 const halftime=!delayed&&phase==='halftime';
 if(halftime){
   document.getElementById('countdown').textContent=`${Number(g.home_score||0)}-${Number(g.visitor_score||0)}`;
 }else{
   const target=parseScheduled(g,delayed?cfg.estimated_start:'');
   document.getElementById('countdown').textContent=(delayed&&!cfg.estimated_start)?'DELAYED':countdownText(target);
 }
 document.getElementById('root').classList.toggle('visible',shouldShow());
 const rotation=Math.max(6,Number(cfg.rotation_seconds||10))*1000;
 if(cards.length>1&&Date.now()-lastCardSwitch>=rotation){cardIndex=(cardIndex+1)%cards.length;showCard(cardIndex);lastCardSwitch=Date.now()}
}
function presentationSignature(payload){
 const copy=structuredClone?structuredClone(payload):JSON.parse(JSON.stringify(payload||{}));
 if(copy&&typeof copy==='object')delete copy.server_time;
 return JSON.stringify(copy||{});
}
async function poll(){
 try{
  const res=await fetch('/api/pregame-presentation',{cache:'no-store'});
  if(res.ok){
   const next=await res.json();
   const sig=presentationSignature(next);
   const oldSig=data?presentationSignature(data):'';
   data=next;
   if(sig!==oldSig){
    const priorIndex=cardIndex;
    renderStatic();
    if(cards.length){
      cardIndex=Math.min(priorIndex,cards.length-1);
      showCard(cardIndex);
    }
   }
  }
 }catch(_){}
 setTimeout(poll,2500);
}
setInterval(tick,250);
poll();
</script>
